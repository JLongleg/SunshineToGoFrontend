<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gameplay</title>
    <link rel="stylesheet" href="Sunshine.css">
    
</head>
<body>    

    <h1>Sunshine (or rain) to go!</h1>

    <!-- div-Box des Spielfelds-->
    <div class="Spielfeld">
    <h1>Das ist das Spielfeld</h1>

        <!-- Sprite-Animation mit Charakter-Shadow -->
        <div class="Character"> 
            <img class="CharacterShadow pixelart" src="CharacterShadowKoffer.png" alt="Charactershadow">
            <img class="CharacterSpriteSheet1 pixelart" src="Spritesheet.png" alt="Character">
        </div>
    
        <p>Tiffany wünscht sich: </p>
        <div>
            <p id="desiredTemperatureOfCharacter1"></p>        
        </div>
        <p>Grad! </p>
        <br><br><br><br><br><br><br><br>(-> Richtung vom Charakter)<br><br><br>
        <p>"Wohin soll die Reise für Tiffany gehen?"</p>

        <!-- Buttons für Städte -->
        <!-- "value" wird per Funktion für jeden Button dem entsprechend gesetzt, welche Städte verfuegbar sind-->
        <!-- Bei Klick prüft die Funktion, ob die Antwort korrekt ist-->
        <input type="button" id="button1" value="City1" onclick="checkAnswer(value)">
        <input type="button" id="button2" value="City2" onclick="checkAnswer(value)">
        <input type="button" id="button3" value="City3" onclick="checkAnswer(value)">

        <!-- Ergebnissatz, ob die Auswahl korrekt war, wird erst nach Klick auf einen Button angezeigt-->
        <div>
            <p id="result"></p>
        </div>
    </div>
    
    

    <script src="Sunshine.js"></script>

</body>
</html>
